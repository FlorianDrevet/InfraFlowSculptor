name: Plan

on:
  push:
  pull_request:
    branches: [main]

jobs:
  plan:
    name: Garde-fou du plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forme du plan
        run: python tools/plan/gate.py lint
      - name: Aucun blocage ni verrou antérieur sans auto-validation
        run: python tools/plan/gate.py check
      - name: Tests du garde-fou
        if: hashFiles('tools/plan/tests/*.py') != ''
        run: python -m unittest discover tools/plan/tests
