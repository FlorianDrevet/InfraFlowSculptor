- task: PowerShell@2
  displayName: Installer les contrôles, les politiques main et retirer l'accès temporaire
  condition: always()
  inputs:
    targetType: filePath
    filePath: .ifs/install/scripts/Install-Azdo.ps1
    arguments: -Phase Finalize -RepositoryPath "$(Build.SourcesDirectory)"
    pwsh: true
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- task: PublishPipelineArtifact@1
  displayName: Publier le rapport d'installation
  condition: always()
  inputs:
    targetPath: $(Agent.TempDirectory)/ifs-install-report.json
    artifact: ifs-install-report
    publishLocation: pipeline
