# Généré par InfraFlowSculptor — projet {{PROJECT_CODE}}. Ne pas modifier : les modifications seront signalées puis remplacées à la prochaine publication. Personnalisation : voir README.ifs.md.
parameters:
- name: project
  type: string
- name: component
  type: string
- name: application
  type: string
- name: registryServiceConnection
  type: string
- name: buildContext
  type: string
- name: dockerfile
  type: string
- name: dependencyCachePath
  type: string
  default: ''
- name: stepsBeforeBuild
  type: stepList
  default: []
- name: stepsAfterBuild
  type: stepList
  default: []

stages:
- stage: Build
  displayName: Construire, analyser et publier l’image
  jobs:
  - job: BuildImage
    displayName: Construire une image immuable après analyse
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: '1'
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        & "$env:IFS_REPOSITORY_ROOT/.ifs/templates/scripts/Set-IfsRunName.ps1" -ManifestPath $env:IFS_MANIFEST_PATH -Component $env:IFS_COMPONENT -Target 'CI'
      displayName: Nommer le run depuis le manifeste
      env:
        IFS_REPOSITORY_ROOT: $(Build.SourcesDirectory)
        IFS_MANIFEST_PATH: $(Build.SourcesDirectory)/.ifs/manifest.json
        IFS_COMPONENT: ${{ parameters.component }}
    - ${{ each step in parameters.stepsBeforeBuild }}:
      - ${{ step }}
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        & "$env:IFS_REPOSITORY_ROOT/.ifs/templates/scripts/Build-IfsImage.ps1" -RepositoryRoot $env:IFS_REPOSITORY_ROOT -BuildContext $env:IFS_BUILD_CONTEXT -DockerfilePath $env:IFS_DOCKERFILE -ImageName $env:IFS_LOCAL_IMAGE_NAME -CacheDirectory $env:IFS_BUILDX_CACHE_DIR
      displayName: Construire l’image localement
      env:
        IFS_REPOSITORY_ROOT: $(Build.SourcesDirectory)
        IFS_BUILD_CONTEXT: ${{ parameters.buildContext }}
        IFS_DOCKERFILE: ${{ parameters.dockerfile }}
        IFS_LOCAL_IMAGE_NAME: ifs-app-${{ parameters.application }}-$(Build.BuildId)
        IFS_BUILDX_CACHE_DIR: ${{ parameters.dependencyCachePath }}
    - ${{ each step in parameters.stepsAfterBuild }}:
      - ${{ step }}
    - task: AzureCLI@2
      displayName: Publier l’image contrôlée en OIDC
      inputs:
        azureSubscription: ${{ parameters.registryServiceConnection }}
        scriptType: pscore
        scriptLocation: scriptPath
        scriptPath: $(Build.SourcesDirectory)/.ifs/templates/scripts/Publish-IfsImage.ps1
        arguments: >
          -ReleasePath "$(Build.SourcesDirectory)/${{ parameters.component }}/infra/release.dev.json"
          -LocalImageName "ifs-app-${{ parameters.application }}-$(Build.BuildId)"
          -Application "${{ parameters.application }}"
          -ImageManifestPath "$(Build.ArtifactStagingDirectory)/app/image.json"
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $artifact = Join-Path $env:IFS_ARTIFACT_ROOT 'app'
        New-Item -ItemType Directory -Path $artifact -Force | Out-Null
        Copy-Item -LiteralPath (Join-Path $env:IFS_REPOSITORY_ROOT '.ifs') -Destination $artifact -Recurse -Force
        Copy-Item -LiteralPath (Join-Path $env:IFS_REPOSITORY_ROOT $env:IFS_COMPONENT) -Destination $artifact -Recurse -Force
      displayName: Ajouter le code de release et les modèles au manifeste image
      env:
        IFS_REPOSITORY_ROOT: $(Build.SourcesDirectory)
        IFS_COMPONENT: ${{ parameters.component }}
        IFS_ARTIFACT_ROOT: $(Build.ArtifactStagingDirectory)
    - publish: $(Build.ArtifactStagingDirectory)/app
      artifact: image
      displayName: Publier l’empreinte de l’image et ses fichiers de release
