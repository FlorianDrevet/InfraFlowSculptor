# Généré par InfraFlowSculptor — projet {{PROJECT_CODE}}. Ne pas modifier : les modifications seront signalées puis remplacées à la prochaine publication. Personnalisation : voir README.ifs.md.
parameters:
- name: project
  type: string
- name: component
  type: string
- name: application
  type: string
- name: buildContext
  type: string
- name: dockerfile
  type: string
- name: dependencyCachePath
  type: string
  default: ''
- name: stepsBeforeBuild
  type: stepList
  default: []
- name: stepsAfterBuild
  type: stepList
  default: []

stages:
- stage: Validate
  displayName: Build de pull request sans connexion Azure
  jobs:
  - job: Build
    displayName: Construire et analyser l’image sans la publier
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: '1'
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        & "$env:IFS_REPOSITORY_ROOT/.ifs/templates/scripts/Set-IfsRunName.ps1" -ManifestPath $env:IFS_MANIFEST_PATH -Component $env:IFS_COMPONENT -Target 'PR'
      displayName: Nommer le run depuis le manifeste
      env:
        IFS_REPOSITORY_ROOT: $(Build.SourcesDirectory)
        IFS_MANIFEST_PATH: $(Build.SourcesDirectory)/.ifs/manifest.json
        IFS_COMPONENT: ${{ parameters.component }}
    - ${{ each step in parameters.stepsBeforeBuild }}:
      - ${{ step }}
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        & "$env:IFS_REPOSITORY_ROOT/.ifs/templates/scripts/Build-IfsImage.ps1" -RepositoryRoot $env:IFS_REPOSITORY_ROOT -BuildContext $env:IFS_BUILD_CONTEXT -DockerfilePath $env:IFS_DOCKERFILE -ImageName $env:IFS_LOCAL_IMAGE_NAME -CacheDirectory $env:IFS_BUILDX_CACHE_DIR
      displayName: Construire l’image localement
      env:
        IFS_REPOSITORY_ROOT: $(Build.SourcesDirectory)
        IFS_COMPONENT: ${{ parameters.component }}
        IFS_BUILD_CONTEXT: ${{ parameters.buildContext }}
        IFS_DOCKERFILE: ${{ parameters.dockerfile }}
        IFS_LOCAL_IMAGE_NAME: ifs-app-${{ parameters.application }}-$(Build.BuildId)
        IFS_BUILDX_CACHE_DIR: ${{ parameters.dependencyCachePath }}
    - ${{ each step in parameters.stepsAfterBuild }}:
      - ${{ step }}
