# Généré par InfraFlowSculptor — projet shop. Ne pas modifier : les modifications seront signalées puis remplacées à la prochaine publication. Personnalisation : voir README.ifs.md.
name: $(Date:yyyyMMdd).$(Rev:r)
trigger: none
parameters:
- name: systemAssignedSqlClientIdDev
  displayName: Client ID SQL de l'identité système DEV (optionnel si la connexion lit Entra)
  type: string
  default: ''
- name: systemAssignedSqlClientIdPrd
  displayName: Client ID SQL de l'identité système PRD (optionnel si la connexion lit Entra)
  type: string
  default: ''
resources:
  pipelines:
  - pipeline: ci
    source: 'shop · orders · infra · CI'
    trigger:
      branches:
        include:
        - main
extends:
  template: /.ifs/templates/infra-release.yml
  parameters:
    project: shop
    component: orders
    defaultBranch: main
    secretWrites: []
    targets:
    - name: dev
      protected: false
      systemAssignedSqlClientId: ${{ parameters.systemAssignedSqlClientIdDev }}
      dependsOn: []
    - name: prd
      protected: true
      systemAssignedSqlClientId: ${{ parameters.systemAssignedSqlClientIdPrd }}
      dependsOn:
      - Deploy_dev
