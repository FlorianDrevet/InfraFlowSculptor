<!-- @dsCard group="Infrastructure" height=420 subtitle="Icônes Azure officielles + repli en tuile" -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>ResourceIcon — aperçu</title></head>
<body>
<div id="root" class="st-root st-stack" style="padding: 16px; gap: 20px"></div>
<script>
  var S = window.Strata, h = React.createElement;
  var types = Object.keys(S.resourceTypes);
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: 12 } },
      types.map(function (t) {
        var m = S.resourceTypes[t];
        return h('div', { key: t, style: { display: 'flex', alignItems: 'center', gap: 10, fontSize: 13 } },
          h(S.ResourceIcon, { type: t, size: 28, alt: '' }),
          h('span', { style: { display: 'flex', flexDirection: 'column' } },
            h('span', null, m.label),
            h('span', { style: { fontFamily: 'var(--font-mono, monospace)', fontSize: 11, color: 'var(--text-3, #7d8797)' } }, t + (m.roadmap ? ' · roadmap' : ''))));
      })),
    h('div', { className: 'st-row', style: { gap: 16, color: 'var(--text-2, #a7b0bf)', fontSize: 12 } },
      h('span', null, 'Tailles'),
      h(S.ResourceIcon, { type: 'WebApp', size: 16 }), h(S.ResourceIcon, { type: 'WebApp', size: 20 }),
      h(S.ResourceIcon, { type: 'WebApp', size: 28 }), h(S.ResourceIcon, { type: 'WebApp', size: 40 }),
      h('span', { style: { marginLeft: 16 } }, 'Repli tuile'),
      h(S.ResourceIcon, { type: 'KeyVault', variant: 'tile' }), h(S.ResourceIcon, { type: 'SqlServer', variant: 'tile' }),
      h(S.ResourceIcon, { type: 'ServiceBusNamespace', variant: 'tile' }))));
</script>
</body>
</html>
