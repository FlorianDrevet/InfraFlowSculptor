<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Icon — aperçu</title></head>
<body>
<div id="root" class="st-root" style="padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px"></div>
<script>
  var S = window.Strata, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    S.Icon.names.map(function (n) {
      return h('div', { key: n, style: { display: 'flex', alignItems: 'center', gap: 8, color: 'var(--text-2, #a7b0bf)', fontSize: 11, fontFamily: 'var(--font-mono, monospace)' } },
        h(S.Icon, { name: n, size: 16, style: { color: 'var(--text, #e8ecf2)' } }), n);
    })));
</script>
</body>
</html>
