<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Segmented — aperçu</title></head>
<body>
<div id="root" class="st-root st-stack" style="padding: 16px"></div>
<script>
  var S = window.Strata, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'st-row' },
      h(S.Segmented, { ariaLabel: 'Vue des ressources', options: [{ value: 'list', label: 'Liste', icon: 'list' }, { value: 'graph', label: 'Graphe', icon: 'graph' }] }),
      h(S.Segmented, { ariaLabel: 'Environnement', mono: true, options: [{ value: 'dev', label: 'dev' }, { value: 'staging', label: 'staging' }, { value: 'prod', label: 'prod' }] })),
    h(S.Segmented, { ariaLabel: 'Résolution DNS', options: [{ value: 'managed', label: 'Zone privée gérée' }, { value: 'hub', label: 'Hub DNS existant' }] })));
</script>
</body>
</html>
