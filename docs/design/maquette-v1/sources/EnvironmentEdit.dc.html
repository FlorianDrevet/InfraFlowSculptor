<!doctype html>

<head>

</head>

<x-dc>

<style>

a{color:#7FD6E8;text-decoration:none}a:hover{color:#A8E5F1}
@media (max-width: 760px){.ifs-side{display:none !important}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0B0E13; color: #E8ECF2; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px">
<div class="ifs-side" style="width: 236px; flex-shrink: 0; background: #0E1218; border-right: 1px solid #222936"><dc-import name="Sidebar" active="environments" scope="project" hint-size="236px,1100px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="min-height: 56px; box-sizing: border-box; padding: 10px 32px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #222936">
<nav aria-label="Fil d'Ariane" style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px"><a href="ProjectOverview.dc.html">shop</a> / <a href="ProjectEnvironments.dc.html">environnements</a> / prd</nav>
<x-import component-from-global-scope="Strata.Button" variant="ghost" href="ProjectEnvironments.dc.html">Annuler</x-import>
<x-import component-from-global-scope="Strata.Button" variant="primary" icon="check" href="ProjectEnvironments.dc.html">Enregistrer</x-import>
</header>
<div style="box-sizing: border-box; width: 100%; max-width: 1280px; padding: 28px 32px 48px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 2 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600">Production</h1>
<x-import component-from-global-scope="Strata.Panel" title="Identité et emplacement">

<x-import component-from-global-scope="Strata.TextField" label="Nom" default-value="Production"></x-import>
<x-import component-from-global-scope="Strata.TextField" label="Code" default-value="prod" mono="{{yes}}" changed="{{yes}}" hint="Avant : prd"></x-import>
<x-import component-from-global-scope="Strata.TextField" label="Abonnement" default-value="b72c…-sub-shop-prd" mono="{{yes}}"></x-import>
<x-import component-from-global-scope="Strata.TextField" label="Région" default-value="francecentral" mono="{{yes}}"></x-import>
<x-import component-from-global-scope="Strata.TextField" label="Connexion de déploiement (service connection)" default-value="ifs-shop-prd" mono="{{yes}}" hint="Fédération d'identité, créée par le script Azure du kit"></x-import>
<x-import component-from-global-scope="Strata.TextField" label="Ordre dans la chaîne" default-value="2"></x-import>
</div>
</x-import>
<x-import component-from-global-scope="Strata.Panel" title="Protection">

<x-import component-from-global-scope="Strata.Toggle" default-checked="{{yes}}" label="Protégé : chaque déploiement exige une approbation"></x-import>
<x-import component-from-global-scope="Strata.TextField" label="Approbateurs (identités Azure DevOps)" default-value="[Shop]\Shop Release Approvers ; lea.bernard@contoso.com"></x-import>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<x-import component-from-global-scope="Strata.TextField" label="Fenêtres de déploiement" default-value="Lun.–jeu. 09:00–17:00 (Europe/Paris)"></x-import>
<x-import component-from-global-scope="Strata.TextField" label="Délai d'attente avant déploiement (min)" default-value="15"></x-import>
</div>
</div>
</x-import>
<x-import component-from-global-scope="Strata.Panel" title="Exécution et réseau">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<x-import component-from-global-scope="Strata.TextField" label="Exécuteurs" default-value="mdp-shop-prd" mono="{{yes}}" hint="Managed DevOps Pool déployé par le composant tooling"></x-import>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 500; color: #A7B0BF">Stratégie DNS privée</span><select style="height: 36px; padding: 0 10px; border-radius: 6px; background: #121720; border: 1px solid #343D4C; color: #E8ECF2; font: inherit; font-size: 13px"><option>Zones existantes (hub Contoso)</option><option>Zones gérées par IFS</option><option>Gérée par une stratégie Azure</option></select></label>
<x-import component-from-global-scope="Strata.TextField" label="Tags de l'environnement" default-value="env-tier=prod, criticality=high" mono="{{yes}}"></x-import>
</div>
</x-import>
</div>
<aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding-top: 50px">
<x-import component-from-global-scope="Strata.Banner" tone="ember" title="Changer le code renomme 9 ressources déjà publiées">Azure créera de nouvelles ressources ; les anciennes seront détachées et apparaîtront dans l'inventaire des ressources détachées.</x-import>

<sc-for list="{{renames}}" as="r" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; border-top: {{r.border}}; font-family: 'JetBrains Mono', monospace; font-size: 12px"><span style="color: #7D8797; text-decoration: line-through">{{r.a}}</span><span style="color: #F0B676">{{r.b}}</span></div>
</sc-for>
<div style="padding: 10px 16px; border-top: 1px solid #1E2430; font-size: 12px; color: #7D8797">… et 4 autres</div>
</x-import>
<label style="display: flex; gap: 10px; font-size: 13px; color: #A7B0BF"><input type="checkbox" style="accent-color: #5BC8DF">J'ai compris : 9 ressources seront recréées en production.</label>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (a, b, first) => ({ a, b, border: first ? 'none' : '1px solid #1E2430' });
    return {
      yes: true,
      renames: [r('kv-shop-main-prd', 'kv-shop-main-prod', true), r('ca-shop-api-prd', 'ca-shop-api-prod'), r('sql-shop-orders-prd', 'sql-shop-orders-prod'), r('sbns-shop-orders-prd', 'sbns-shop-orders-prod'), r('rg-shop-orders-main-prd', 'rg-shop-orders-main-prod')]
    };
  }
}
</script>
