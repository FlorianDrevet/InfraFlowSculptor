<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ca api — liaisons</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/strata/components/bundle.css">
<script src="ds/strata/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E13}
a{color:#7FD6E8;text-decoration:none}a:hover{color:#A8E5F1}
@media (max-width: 760px){.ifs-side{display:none !important}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0B0E13; color: #E8ECF2; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px">
<div class="ifs-side" style="width: 236px; flex-shrink: 0; background: #0E1218; border-right: 1px solid #222936"><dc-import name="Sidebar" active="comp-orders" scope="project" hint-size="236px,1100px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="min-height: 56px; box-sizing: border-box; padding: 10px 32px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #222936">
<nav aria-label="Fil d'Ariane" style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px"><a href="ProjectOverview.dc.html">shop</a> / <a href="Component.dc.html">orders</a> / api / liaisons</nav>
<x-import component-from-global-scope="Strata.Button" variant="primary" icon="plus" href="AddLink.dc.html">Ajouter une liaison</x-import>
</header>
<div style="box-sizing: border-box; width: 100%; max-width: 1280px; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<x-import component-from-global-scope="Strata.ResourceIcon" type="ContainerApp" size="{{s40}}" alt=""></x-import>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><h1 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 24px; line-height: 32px; font-weight: 500">api</h1><x-import component-from-global-scope="Strata.Badge">Container App</x-import></div>
</div>
<dc-import name="ResourceTabs" active="links" variant="app" hint-size="100%,48px"></dc-import>
<x-import component-from-global-scope="Strata.Panel" title="Liaisons sortantes" subtitle="Ce que api utilise, et ce qu'IFS en déduit" padded="{{no}}">
<sc-for list="{{out}}" as="l" hint-placeholder-count="7">
<div style="display: flex; gap: 14px; padding: 12px 16px; border-top: {{l.border}}; flex-wrap: wrap; align-items: flex-start">
<span style="{{l.kindStyle}}">{{l.kind}}</span>
<span style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">{{l.target}}</span><span style="font-size: 12px; color: #7D8797">{{l.params}}</span></span>
<span style="flex: 1 1 320px; min-width: 0; font-size: 12px; color: #A7B0BF">{{l.implies}}</span>
<span style="{{l.originStyle}}">{{l.origin}}</span>
</div>
</sc-for>
</x-import>
<x-import component-from-global-scope="Strata.Panel" title="Liaisons entrantes" subtitle="Ce qui dépend de api" padded="{{no}}">
<div style="display: flex; gap: 14px; padding: 12px 16px; font-size: 13px; color: #A7B0BF">Aucune ressource ne dépend de api. Un domaine personnalisé et une origine Front Door apparaîtraient ici.</div>
</x-import>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = (bg, fg) => 'display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; min-width: 150px; justify-content: center; background: ' + bg + '; color: ' + fg + ';';
    const K1 = kind('#1E2430', '#A7B0BF'), K2 = kind('rgba(91,200,223,0.12)', '#7FD6E8');
    const exp = 'font-size: 12px; color: #A7B0BF; white-space: nowrap;', imp = 'font-size: 12px; color: #7D8797; font-style: italic; white-space: nowrap;';
    const l = (k, ks, target, params, implies, origin, first) => ({ kind: k, kindStyle: ks, target, params, implies, origin, originStyle: origin === 'Explicite' ? exp : imp, border: first ? 'none' : '1px solid #1E2430' });
    return {
      s40: 40,
      out: [
        l('Hébergement', K1, 'orders / cae main', 'Même abonnement et même région : vérifié', '—', 'Explicite', true),
        l('Tirage d’image', K2, 'platform / cr main (crshopmainshared)', 'Identité : id api', 'Rôle AcrPull pour id-shop-api-* sur le registre (portée externe : sub-platform)', 'Explicite'),
        l('Télémétrie', K1, 'core / appi main', '—', 'Paramètre APPLICATIONINSIGHTS_CONNECTION_STRING', 'Explicite'),
        l('Lecture de configuration', K2, 'core / appcs main', 'Identité : id api · variable AZURE_APPCONFIG_ENDPOINT', 'Rôle App Configuration Data Reader ; Secrets User sur kv main (clés Key Vault du magasin)', 'Explicite'),
        l('Accès', K2, 'orders / sbns orders', 'Rôle : Azure Service Bus Data Sender · identité id api', 'Attribution de rôle sur le namespace', 'Explicite'),
        l('Accès aux données', K2, 'orders / sqldb orders', 'Niveau : LectureÉcriture · identité id api', 'Script post-déploiement : utilisateur Entra, db_datareader, db_datawriter', 'Explicite'),
        l('Lecture de secret', K2, 'core / kv main', 'Identité : id api', 'Rôle Key Vault Secrets User', 'Implicite · paramètre Payments__ApiKey'),
        l('Dépendance de valeur', K1, 'orders / sql orders', 'Sortie fullyQualifiedDomainName', 'Ordre de déploiement', 'Implicite · paramètre Sql__Server'),
        l('Diagnostics', K1, 'core / log main', 'Tous les journaux, toutes les métriques', 'Paramètre de diagnostic', 'Implicite · espace par défaut de orders')
      ]
    };
  }
}
</script>
</body>
</html>
