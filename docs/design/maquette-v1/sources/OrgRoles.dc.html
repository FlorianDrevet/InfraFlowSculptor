<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Organisation — rôles et permissions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/strata/components/bundle.css">
<script src="ds/strata/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E13}
a{color:#7FD6E8;text-decoration:none}a:hover{color:#A8E5F1}
@media (max-width: 760px){.ifs-side{display:none !important}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0B0E13; color: #E8ECF2; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px">
<div class="ifs-side" style="width: 236px; flex-shrink: 0; background: #0E1218; border-right: 1px solid #222936"><dc-import name="Sidebar" active="org-roles" scope="org" hint-size="236px,1100px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="min-height: 56px; box-sizing: border-box; padding: 10px 32px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #222936">
<nav aria-label="Fil d'Ariane" style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px">contoso / organisation / rôles</nav>
<x-import component-from-global-scope="Strata.Button" variant="primary" icon="plus">Rôle personnalisé</x-import>
</header>
<div style="box-sizing: border-box; width: 100%; max-width: 1280px; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600">Rôles et permissions</h1>
<p style="margin: 0; color: #A7B0BF; max-width: 860px">Huit rôles prédéfinis et vos rôles personnalisés. Les permissions marquées « composant » peuvent être limitées à certains composants d'un projet.</p>
</div>
<div style="border-radius: 10px; border: 1px solid #252C38; background: #11151C; overflow-x: auto">
<div style="min-width: 1180px">
<div style="display: grid; grid-template-columns: minmax(0, 2.6fr) repeat(9, minmax(0, 1fr)); gap: 8px; padding: 12px 16px; font-size: 12px; font-weight: 500; color: #A7B0BF; background: #141922; align-items: end">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #7D8797">Permission</span>
<sc-for list="{{roles}}" as="r" hint-placeholder-count="9"><span style="text-align: center; {{r.style}}">{{r.label}}</span></sc-for>
</div>
<sc-for list="{{perms}}" as="p" hint-placeholder-count="15">
<div style="display: grid; grid-template-columns: minmax(0, 2.6fr) repeat(9, minmax(0, 1fr)); gap: 8px; align-items: center; padding: 9px 16px; border-top: 1px solid #1E2430; font-size: 13px">
<span style="display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">{{p.id}}<sc-if value="{{p.comp}}" hint-placeholder-val="{{false}}"><span style="margin-left: 6px; font-family: 'Instrument Sans', sans-serif; font-size: 11px; color: #F0B676">composant</span></sc-if></span><span style="font-size: 12px; color: #7D8797">{{p.text}}</span></span>
<sc-for list="{{p.cells}}" as="c" hint-placeholder-count="9"><span style="{{c}}"></span></sc-for>
</div>
</sc-for>
</div>
</div>
<x-import component-from-global-scope="Strata.Panel" title="Réglages de séparation des tâches" subtitle="Appliqués par projet depuis ses paramètres">
<div style="display: flex; flex-direction: column; gap: 12px">
<x-import component-from-global-scope="Strata.Toggle" default-checked="{{yes}}" label="Publication à deux personnes disponible pour les projets"></x-import>
<x-import component-from-global-scope="Strata.Toggle" default-checked="{{yes}}" label="Restreindre les liaisons entrantes d'un composant (sur approbation de son responsable)"></x-import>
</div>
</x-import>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const Y = 'justify-self: center; width: 10px; height: 10px; border-radius: 999px; background: #5BC8DF;';
    const N = 'justify-self: center; width: 10px; height: 10px; border-radius: 999px; border: 1px solid #343D4C;';
    const roles = ['Lecteur', 'Auditeur', 'Développeur', 'Contributeur', 'Resp. déploiements', 'Archi. plateforme', 'Admin. projet', 'Propriétaire', 'SRE (perso.)'];
    const m = {
      'projet.lire': [1,1,1,1,1,1,1,1,1], 'audit.lire': [0,1,0,0,0,0,1,1,1], 'modele.modifier': [0,0,1,1,0,1,1,1,0], 'applications.gerer': [0,0,1,1,0,1,1,1,0],
      'composants.gerer': [0,0,0,1,0,1,1,1,0], 'conventions.gerer': [0,0,0,0,0,1,1,1,0], 'environnements.gerer': [0,0,0,0,1,1,1,1,1], 'environnements.proteges.gerer': [0,0,0,0,0,1,1,1,0],
      'publication.gerer': [0,0,0,0,0,1,1,1,0], 'generer': [0,0,1,1,1,1,1,1,1], 'publier': [0,0,0,1,1,1,1,1,1], 'installation.gerer': [0,0,0,0,1,1,1,1,1],
      'propositions.appliquer': [0,0,0,1,0,1,1,1,0], 'membres.gerer': [0,0,0,0,0,0,1,1,0], 'projet.administrer': [0,0,0,0,0,0,0,1,0]
    };
    const texts = {
      'projet.lire': 'Tout consulter', 'audit.lire': 'Journal d’audit du projet', 'modele.modifier': 'Ressources, liaisons, paramètres', 'applications.gerer': 'Build, étapes, stratégie',
      'composants.gerer': 'Créer, dupliquer, supprimer des composants', 'conventions.gerer': 'Nommage, tags, groupes Entra', 'environnements.gerer': 'Environnements non protégés', 'environnements.proteges.gerer': 'Protection, approbateurs, abonnements protégés',
      'publication.gerer': 'Plan de publication, relecteurs', 'generer': 'Générer une révision', 'publier': 'Publier une révision', 'installation.gerer': 'Liste de contrôle, ressources détachées',
      'propositions.appliquer': 'Appliquer ou rejeter une proposition', 'membres.gerer': 'Rôles de projet', 'projet.administrer': 'Langage, plateforme, export, suppression'
    };
    const comp = { 'modele.modifier': true, 'applications.gerer': true, 'propositions.appliquer': true };
    return {
      yes: true,
      roles: roles.map((label, i) => ({ label, style: i === 8 ? 'color: #F0B676' : '' })),
      perms: Object.keys(m).map(id => ({ id, text: texts[id], comp: !!comp[id], cells: m[id].map(v => v ? Y : N) }))
    };
  }
}
</script>
</body>
</html>
