<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Propositions de modification</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/strata/components/bundle.css">
<script src="ds/strata/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E13}
a{color:#7FD6E8;text-decoration:none}a:hover{color:#A8E5F1}
@media (max-width: 760px){.ifs-side{display:none !important}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0B0E13; color: #E8ECF2; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px">
<div class="ifs-side" style="width: 236px; flex-shrink: 0; background: #0E1218; border-right: 1px solid #222936"><dc-import name="Sidebar" active="proposals" scope="workspace" hint-size="236px,1100px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="min-height: 56px; box-sizing: border-box; padding: 10px 32px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #222936">
<nav aria-label="Fil d'Ariane" style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px">contoso / propositions</nav>
</header>
<div style="box-sizing: border-box; width: 100%; max-width: 1280px; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600">Propositions de modification</h1>
<p style="margin: 0; color: #A7B0BF; max-width: 760px">Des modifications préparées par un agent IA, un import ou un brouillon soumis. Rien n'est appliqué au modèle avant votre relecture.</p>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5"><button type="button" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="5">
<a href="ProposalReview.dc.html" style="display: flex; gap: 16px; align-items: flex-start; padding: 16px 18px; border-radius: 10px; background: #11151C; border: 1px solid #252C38; color: #E8ECF2; flex-wrap: wrap">
<span style="{{p.originStyle}}">{{p.origin}}</span>
<span style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-weight: 600">{{p.title}}</span><span style="{{p.stateStyle}}">{{p.state}}</span></span>
<span style="font-size: 13px; color: #A7B0BF">{{p.summary}}</span>
<span style="font-size: 12px; color: #7D8797">{{p.meta}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; color: #7D8797"><span style="font-family: 'JetBrains Mono', monospace">{{p.counts}}</span><span>{{p.findings}}</span></span>
</a>
</sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = on => 'height: 30px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 500; ' + (on ? 'border: 1px solid #3A4656; background: #1E2430; color: #E8ECF2;' : 'border: 1px solid #252C38; background: transparent; color: #A7B0BF;');
    const f = (label, on) => ({ label, pressed: on ? 'true' : 'false', style: pill(on) });
    const chip = (bg, fg) => 'display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: ' + bg + '; color: ' + fg + ';';
    const origin = (bg, fg) => 'display: inline-flex; align-items: center; justify-content: center; height: 28px; padding: 0 10px; border-radius: 6px; font-family: \'JetBrains Mono\', monospace; font-size: 11px; background: ' + bg + '; color: ' + fg + '; white-space: nowrap;';
    return {
      filters: [f('Ouvertes · 4', true), f('Appliquées', false), f('Rejetées', false), f('Périmées · 1', false), f('Mes projets seulement', false)],
      items: [
        { origin: 'DEMANDE D’ACCÈS', originStyle: origin('rgba(181,154,242,0.14)', '#C9B6F6'), title: 'payments lit le secret stripe-key de kv main', state: 'Approbation attendue', stateStyle: chip('rgba(232,166,90,0.12)', '#F0B676'), summary: 'Camille Martin (orders, payments) demande Key Vault Secrets User pour id payments sur kv-shop-main-*. Un approbateur du composant core doit consentir ; aucun droit croisé n’est accordé.', meta: 'Boutique en ligne · demandée par Camille Martin · il y a 2 h · approbateurs possibles : Florian Drevet', counts: '+1 liaison · +1 rôle', findings: 'Aucun constat' },
        { origin: 'AGENT IA', originStyle: origin('rgba(91,200,223,0.12)', '#7FD6E8'), title: 'File refunds et droit d’écriture pour api', state: 'Ouverte', stateStyle: chip('rgba(91,200,223,0.12)', '#7FD6E8'), summary: 'Ajoute la file refunds à sbns orders et la liaison d’accès Data Sender de ca api vers sbns orders.', meta: 'Boutique en ligne · préparée par Claude pour Camille Martin · il y a 25 min', counts: '+1 enfant · +1 liaison', findings: 'Aucun constat' },
        { origin: 'BROUILLON', originStyle: origin('#1E2430', '#A7B0BF'), title: 'Passage en privé de la prod', state: 'Ouverte', stateStyle: chip('rgba(91,200,223,0.12)', '#7FD6E8'), summary: 'kv, appcs, sql et sbns en exposition privée en prd, spokes appairés au hub, Managed DevOps Pool.', meta: 'Boutique en ligne · soumis par Florian Drevet · hier', counts: '24 modifications', findings: '1 avertissement' },
        { origin: 'IMPORT', originStyle: origin('rgba(232,166,90,0.12)', '#F0B676'), title: 'Reprise de rg-legacy-payments', state: 'Ouverte', stateStyle: chip('rgba(91,200,223,0.12)', '#7FD6E8'), summary: 'Import de 11 ressources depuis le groupe de ressources Azure, 3 écarts acceptés, noms forcés pour 4 ressources.', meta: 'Woodgrove Payments · import lancé par Léa Bernard · lun.', counts: '+11 ressources · +9 liaisons', findings: '3 avertissements' },
        { origin: 'RESTAURATION', originStyle: origin('#1E2430', '#A7B0BF'), title: 'Restaurer orders à la version 212', state: 'Périmée', stateStyle: chip('rgba(232,166,90,0.12)', '#F0B676'), summary: 'Le modèle a changé depuis : 2 commandes ne s’appliquent plus. Recréez la restauration depuis l’historique.', meta: 'Boutique en ligne · créée par Camille Martin · il y a 3 j', counts: '6 modifications', findings: '—' },
        { origin: 'AGENT IA', originStyle: origin('rgba(91,200,223,0.12)', '#7FD6E8'), title: 'Alertes recommandées sur orders', state: 'Appliquée', stateStyle: chip('rgba(92,192,138,0.12)', '#7ED3A3'), summary: 'Active les alertes recommandées de orders avec le groupe d’actions ag-shop-oncall.', meta: 'Boutique en ligne · appliquée par Florian Drevet · 28/09', counts: '+8 alertes implicites', findings: 'Aucun constat' }
      ]
    };
  }
}
</script>
</body>
</html>
